name: EZ-FAIR tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.2 reportlab==4.4.3
      - name: Check installable package metadata and console entrypoint
        run: |
          python -m pip install --no-deps .
          python -c "from importlib.metadata import version; assert version('ez-fair') == '0.2.0b1'"
      - name: Compile all tracked Python scripts and tests
        run: git ls-files -z '*.py' | xargs -0 -r python -m py_compile
      - name: Headless import of both GUI entrypoints
        run: python -c "import ez_fair, ez_fair_enhancements, polished_gui, extractor_active; print('GUI import OK')"
      - name: Repo health check
        run: python tools/repo_health.py
      - name: Run tests
        run: python -m pytest -q
      - name: Generate synthetic demo inputs
        run: python tools/make_demo_inputs.py --output-dir demo_inputs
      - name: Smoke test local runner
        run: |
          mkdir -p demo_outputs
          python local_test_runner.py --pdf demo_inputs/demo_drawing.pdf --template demo_inputs/demo_template.xlsx --output-dir demo_outputs
          test -f demo_outputs/demo_drawing_BALLOONED.pdf
          test -f demo_outputs/demo_drawing_FAI.xlsx
          test -f demo_outputs/EZ_FAI_DEBUG_REPORT.txt
          test -f demo_outputs/EXTRACTION_SUMMARY.txt
      - name: Report synthetic extraction benchmark (diagnostic only)
        run: |
          python tools/evaluate_extraction.py --manifest docs/examples/demo_benchmark.json --output demo_outputs/benchmark.json
      - name: Upload synthetic demo outputs
        uses: actions/upload-artifact@v4
        with:
          name: ez-fair-demo-outputs
          path: |
            demo_outputs/demo_drawing_BALLOONED.pdf
            demo_outputs/demo_drawing_FAI.xlsx
            demo_outputs/EZ_FAI_DEBUG_REPORT.txt
            demo_outputs/EXTRACTION_SUMMARY.txt
            demo_outputs/benchmark.json

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate PowerShell syntax without installing
        shell: pwsh
        run: |
          foreach ($file in (Get-ChildItem -Filter '*.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "PowerShell syntax failed: $($file.Name) $errors" }
          }
      - name: Install Python packages
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.2
      - name: GUI import smoke test
        run: python -c "import ez_fair, ez_fair_enhancements, polished_gui, extractor_active"
      - name: Run tests
        run: python -m pytest -q
