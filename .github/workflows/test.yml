name: EZ-FAIR tests

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest reportlab

      - name: Compile scripts
        run: |
          python -m py_compile ez_fai_builder.py local_test_runner.py fai_template_writer.py tools/repo_health.py tools/make_demo_inputs.py

      - name: Repo health check
        run: |
          python tools/repo_health.py

      - name: Run tests if present
        run: |
          if [ -d tests ]; then python -m pytest -q; else echo "No tests folder found yet."; fi

      - name: Generate demo inputs
        run: |
          python tools/make_demo_inputs.py --output-dir demo_inputs

      - name: Smoke test local runner
        run: |
          mkdir -p demo_outputs
          python local_test_runner.py --pdf demo_inputs/demo_drawing.pdf --template demo_inputs/demo_template.xlsx --output-dir demo_outputs
          test -f demo_outputs/demo_drawing_BALLOONED.pdf
          test -f demo_outputs/demo_drawing_FAI.xlsx
          test -f demo_outputs/EZ_FAI_DEBUG_REPORT.txt
          test -f demo_outputs/EXTRACTION_SUMMARY.txt

      - name: Upload demo outputs
        uses: actions/upload-artifact@v4
        with:
          name: ez-fair-demo-outputs
          path: |
            demo_outputs/demo_drawing_BALLOONED.pdf
            demo_outputs/demo_drawing_FAI.xlsx
            demo_outputs/EZ_FAI_DEBUG_REPORT.txt
            demo_outputs/EXTRACTION_SUMMARY.txt
