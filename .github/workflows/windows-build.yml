name: EZ-FAIR Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/gdt-control-candidates
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'ez_fair.spec'
      - 'windows_version_info.txt'
      - 'build_windows.ps1'
      - 'installer/**'
      - '.github/workflows/windows-build.yml'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $text = Get-Content '.\app_version.py' -Raw
          if ($text -notmatch 'APP_VERSION\s*=\s*["'']([^"'']+)["'']') {
            throw 'APP_VERSION could not be read from app_version.py.'
          }
          $version = $Matches[1]
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building EZ FAIR $version"

      - name: Build and test Windows package
        shell: pwsh
        run: .\build_windows.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build machine-wide installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:APP_VERSION" installer\EZ-FAIR.iss
          $installer = ".\release\EZ-FAIR-$env:APP_VERSION-Setup-x64.exe"
          if (-not (Test-Path $installer)) {
            throw "Machine-wide installer was not produced: $installer"
          }

      - name: Verify packaged application
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $exe = '.\dist\EZ-FAIR\EZ-FAIR.exe'
          if (-not (Test-Path $exe)) { throw 'EZ-FAIR.exe was not produced.' }
          $info = (Get-Item $exe).VersionInfo
          if ($info.ProductName -ne 'EZ FAIR') { throw "Unexpected ProductName: $($info.ProductName)" }
          if ($info.CompanyName -ne 'Daniel Boone Engineering') { throw "Unexpected CompanyName: $($info.CompanyName)" }
          if ($info.FileDescription -ne 'EZ FAIR Inspection Platform') { throw "Unexpected FileDescription: $($info.FileDescription)" }
          if (-not $info.ProductVersion.StartsWith($env:APP_VERSION)) { throw "Unexpected ProductVersion: $($info.ProductVersion)" }
          if (-not (Test-Path '.\dist\EZ-FAIR\_internal\tesseract\tesseract.exe')) { throw 'Bundled OCR executable missing.' }
          Get-Item $exe | Format-List Name,Length,LastWriteTime
          $info | Format-List ProductName,CompanyName,FileDescription,FileVersion,ProductVersion,OriginalFilename

      - name: Generate checksums
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $files = @(
            ".\release\EZ-FAIR-$env:APP_VERSION-Setup-x64.exe",
            '.\dist\EZ-FAIR-Windows-x64.zip'
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content '.\release\SHA256SUMS.txt' -Encoding ascii

      - name: Upload Windows installer and package
        uses: actions/upload-artifact@v4
        with:
          name: EZ-FAIR-${{ steps.version.outputs.version }}-Windows-Release
          path: |
            release/EZ-FAIR-${{ steps.version.outputs.version }}-Setup-x64.exe
            release/SHA256SUMS.txt
            dist/EZ-FAIR-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
