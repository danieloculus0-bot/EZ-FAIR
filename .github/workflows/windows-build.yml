name: EZ-FAIR Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/gdt-control-candidates
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'ez_fair.spec'
      - 'build_windows.ps1'
      - '.github/workflows/windows-build.yml'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Build and test Windows package
        shell: pwsh
        run: .\build_windows.ps1

      - name: Smoke-check executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path '.\dist\EZ-FAIR\EZ-FAIR.exe')) {
            throw 'EZ-FAIR.exe was not produced.'
          }
          Get-Item '.\dist\EZ-FAIR\EZ-FAIR.exe' | Format-List Name,Length,LastWriteTime

      - name: Upload portable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: EZ-FAIR-Windows-x64
          path: |
            dist/EZ-FAIR/**
            dist/EZ-FAIR-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
