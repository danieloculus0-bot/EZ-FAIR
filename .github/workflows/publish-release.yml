name: Publish EZ FAIR Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.2.0"
        required: true
        type: string
      prerelease:
        description: "Mark as prerelease"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    env:
      SIGNING_CERT_BASE64: ${{ secrets.EZ_FAIR_SIGNING_CERT_BASE64 }}
      SIGNING_CERT_PASSWORD: ${{ secrets.EZ_FAIR_SIGNING_CERT_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set release version
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?$') { throw "Invalid version: $version" }
          Set-Content -Path app_version.py -Value ('"""EZ FAIR application version."""' + "`nAPP_VERSION = `"$version`"`n") -Encoding UTF8
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build and test complete Windows package
        shell: pwsh
        run: .\build_windows.ps1

      - name: Install release tools
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          python -m pip install cyclonedx-bom

      - name: Build installer and release package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:RELEASE_VERSION" installer\EZ-FAIR.iss
          Copy-Item "dist\EZ-FAIR-Windows-x64.zip" "release\EZ-FAIR-$env:RELEASE_VERSION-Windows-x64.zip" -Force
          if (-not (Test-Path "release\EZ-FAIR-$env:RELEASE_VERSION-Setup-x64.exe")) { throw 'Installer was not produced.' }

      - name: Generate SBOM
        shell: pwsh
        run: cyclonedx-py environment --output-format JSON --output-file "release\EZ-FAIR-$env:RELEASE_VERSION-SBOM.json"

      - name: Optional Authenticode signing
        if: ${{ env.SIGNING_CERT_BASE64 != '' }}
        shell: pwsh
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP 'ez-fair-signing.pfx'
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:SIGNING_CERT_BASE64))
          $targets = @(
            "dist\EZ-FAIR\EZ-FAIR.exe",
            "release\EZ-FAIR-$env:RELEASE_VERSION-Setup-x64.exe"
          )
          foreach ($target in $targets) {
            & signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certPath /p $env:SIGNING_CERT_PASSWORD $target
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed for $target" }
          }
          Remove-Item $certPath -Force
          Compress-Archive -Path dist\EZ-FAIR\* -DestinationPath "release\EZ-FAIR-$env:RELEASE_VERSION-Windows-x64.zip" -Force

      - name: Generate release integrity manifest
        shell: pwsh
        run: |
          $installer = "release\EZ-FAIR-$env:RELEASE_VERSION-Setup-x64.exe"
          $windows = "release\EZ-FAIR-$env:RELEASE_VERSION-Windows-x64.zip"
          $manifest = [ordered]@{
            schema_version = 1
            product = 'EZ FAIR'
            version = $env:RELEASE_VERSION
            installer = [ordered]@{
              name = [System.IO.Path]::GetFileName($installer)
              sha256 = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
              install_type = 'machine-wide-windows-installer'
              silent_install = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART'
            }
            windows_package = [ordered]@{
              name = [System.IO.Path]::GetFileName($windows)
              sha256 = (Get-FileHash -Algorithm SHA256 $windows).Hash.ToLowerInvariant()
              bundled_ocr = $true
            }
            update_api = 'https://api.github.com/repos/danieloculus0-bot/EZ-FAIR/releases/latest'
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content "release\EZ-FAIR-release-manifest.json" -Encoding UTF8

      - name: Create tag and GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_version.py
          git commit -m "Release $tag"
          git tag $tag
          git push origin HEAD:${{ github.ref_name }}
          git push origin $tag
          $args = @('release','create',$tag,
            "release\EZ-FAIR-$env:RELEASE_VERSION-Setup-x64.exe",
            "release\EZ-FAIR-$env:RELEASE_VERSION-Windows-x64.zip",
            "release\EZ-FAIR-$env:RELEASE_VERSION-SBOM.json",
            "release\EZ-FAIR-release-manifest.json",
            '--title',"EZ FAIR $env:RELEASE_VERSION",
            '--generate-notes')
          if ('${{ inputs.prerelease }}' -eq 'true') { $args += '--prerelease' }
          gh @args
