name: Publish EZ FAIR Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.2.0"
        required: true
        type: string
      prerelease:
        description: "Mark as prerelease"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set release version
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?$') { throw "Invalid version: $version" }
          Set-Content -Path app_version.py -Value ('"""EZ FAIR application version."""' + "`nAPP_VERSION = `"$version`"`n") -Encoding UTF8
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pyinstaller reportlab

      - name: Run tests
        run: python -m pytest -q

      - name: Build portable application
        run: pyinstaller --noconfirm --clean ez_fair.spec

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:RELEASE_VERSION" installer\EZ-FAIR.iss
          Compress-Archive -Path dist\EZ-FAIR\* -DestinationPath "release\EZ-FAIR-$env:RELEASE_VERSION-Windows-x64.zip" -Force

      - name: Create tag and GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_version.py
          git commit -m "Release $tag"
          git tag $tag
          git push origin HEAD:${{ github.ref_name }}
          git push origin $tag
          $args = @('release','create',$tag,
            "release\EZ-FAIR-$env:RELEASE_VERSION-Setup-x64.exe",
            "release\EZ-FAIR-$env:RELEASE_VERSION-Windows-x64.zip",
            '--title',"EZ FAIR $env:RELEASE_VERSION",
            '--generate-notes')
          if ('${{ inputs.prerelease }}' -eq 'true') { $args += '--prerelease' }
          gh @args
